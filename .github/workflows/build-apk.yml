name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Android Project
        run: |
          cordova create rawafed com.rawafed.transport "Rawafed Transport"
          cd rawafed
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK (Debug)
        run: |
          cd rawafed
          cordova build android --device

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rawafed-transport-apk
          path: rawafed/platforms/android/app/build/outputs/apk/debug/app-debug.apk
